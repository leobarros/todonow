{% extends "base.html" %}
{% block title %}{{ status }} · {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6 text-center py-5">
    <div class="bujo-card p-5">
      <div class="display-1 fw-bold text-primary">{{ status }}</div>
      <h1 class="h4 mt-2">{{ title }}</h1>
      {% if detail %}<p class="text-body-secondary">{{ detail }}</p>{% endif %}
      <div class="d-flex flex-wrap gap-2 justify-content-center mt-4">
        <a class="btn btn-primary" href="{{ url_for('main.dashboard') }}"><i class="bi bi-house me-1"></i>Ir para Hoje</a>
        {% if not current_user.is_authenticated %}
          <a class="btn btn-outline-secondary" href="{{ url_for('auth.login') }}"><i class="bi bi-box-arrow-in-right me-1"></i>Entrar</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
