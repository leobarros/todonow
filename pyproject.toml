[project]
name = "todonow"
version = "1.0.0"
description = "Gerenciador de tarefas local com estilo BUJO (Flask + Bootstrap) para homelab"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py", "wsgi.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "migrations", "app/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # quebras de linha tratadas pelo formatador
    "B008",   # Flask usa chamadas em defaults
    "SIM108", # ternários nem sempre são mais legíveis
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"app/templates/_macros.html" = []
