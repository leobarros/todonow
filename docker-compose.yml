# todonow — docker-compose para o homelab
#
# Usa a imagem publicada no Docker Hub (nickolback/todonow):
#
#   cp .env.example .env        # ajuste SECRET_KEY e a senha do admin
#   docker compose up -d        # baixa a latest e sobe (já confere a versão)
#   docker compose logs -f
#
# Para construir a partir do código-fonte (em vez de baixar):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Consumo de memória: o app inteiro (gunicorn + SQLite) roda bem abaixo de
# 512 MB; o limite explícito abaixo garante que nunca chegue perto dos 4 GB.

services:
  todonow:
    # Imagem do Docker Hub, sempre na tag `latest`: cada `docker compose up`
    # confere se saiu versão nova e recria o container se mudou.
    # Para fixar uma versão (reproduzível), troque no .env:
    #   TODONOW_IMAGE=nickolback/todonow:1.1.0
    # Para não consultar o registry a cada up:
    #   TODONOW_PULL_POLICY=missing
    image: ${TODONOW_IMAGE:-nickolback/todonow:latest}
    pull_policy: ${TODONOW_PULL_POLICY:-always}
    container_name: todonow
    restart: unless-stopped

    env_file:
      # Copie .env.example para .env antes de subir (opcional, há defaults).
      - path: .env
        required: false
    environment:
      # Caminho do banco/backups dentro do volume — não altere sem trocar o volume.
      DATA_DIR: /data
      BACKUP_DIR: /data/backups
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      APP_LOCALE: ${APP_LOCALE:-pt_BR}
      WEEK_START: ${WEEK_START:-6}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-auto}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      TASKS_PER_PAGE: ${TASKS_PER_PAGE:-50}
      BACKUP_KEEP: ${BACKUP_KEEP:-20}

    ports:
      # TODONOW_BIND permite expor só numa interface — ex.: o IP do Tailscale
      # (TODONOW_BIND=100.64.0.1) ou só localhost (127.0.0.1). Padrão: todas.
      - "${TODONOW_BIND:-0.0.0.0}:${TODONOW_PORT:-8000}:8000"

    volumes:
      - todonow-data:/data
      # Descomente para guardar os snapshots fora do volume (ex.: pasta do NAS):
      # - /srv/todonow/backups:/data/backups

    # ---- limites de recurso (bem abaixo dos 4 GB exigidos) ----
    mem_limit: ${TODONOW_MEM_LIMIT:-512m}
    memswap_limit: ${TODONOW_MEM_LIMIT:-512m}
    mem_reservation: 128m
    cpus: ${TODONOW_CPUS:-1.0}
    pids_limit: 256

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  todonow-data:
    name: todonow-data
